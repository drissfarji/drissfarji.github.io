name: Deploy to GitHub Pages

# Two designs live side by side:
#   /      -> the current design on main
#   /old/  -> the original design, kept on the `legacy-design` branch (tag `design-v1` marks the unpatched original)
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current design (main)
        uses: actions/checkout@v4

      - name: Checkout original design
        uses: actions/checkout@v4
        with:
          ref: legacy-design
          path: old

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            old/package-lock.json

      - name: Build original design (served at /old/)
        working-directory: old
        run: |
          npm ci
          BASE_PATH=/old/ npm run build

      - name: Build current design (served at /)
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p site/old
          cp -R dist/. site/
          cp -R old/dist/. site/old/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
